<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Footer</title>
<!-- Bootstrap CSS -->
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
</head>
<body>
<footer class="bg-light mt-auto" style="padding: 20px 0; border-top: 1px solid #ddd;">
    <div class="container">
        <div class="row text-center">
            <!-- About Us -->
            <div class="col-md-3">
                <h5 class="font-weight-bold">About Us</h5>
                <p><a href="#" class="text-dark text-decoration-none">Blog</a></p>
            </div>

            <!-- Service Categories -->
            <div class="col-md-3">
                <h5 class="font-weight-bold">Service Categories</h5>
                <p><a href="#" class="text-dark text-decoration-none">Residential</a></p>
                <p><a href="#" class="text-dark text-decoration-none">Commercial</a></p>
                <p><a href="#" class="text-dark text-decoration-none">Others</a></p>
            </div>

            <!-- Follow Us -->
            <div class="col-md-3">
                <h5 class="font-weight-bold">Follow Us</h5>
                <p>
                    <a href="https://facebook.com" target="_blank" class="text-dark text-decoration-none me-3">
                        <i class="bi bi-facebook"></i> Facebook
                    </a>
                </p>
                <p>
                    <a href="https://instagram.com" target="_blank" class="text-dark text-decoration-none me-3">
                        <i class="bi bi-instagram"></i> Instagram
                    </a>
                </p>
                <p>
                    <a href="https://twitter.com" target="_blank" class="text-dark text-decoration-none me-3">
                        <i class="bi bi-twitter"></i> Twitter
                    </a>
                </p>
                <p>
                    <a href="https://youtube.com" target="_blank" class="text-dark text-decoration-none me-3">
                        <i class="bi bi-youtube"></i> YouTube
                    </a>
                </p>
            </div>

            <!-- Contact Us -->
            <div class="col-md-3">
                <h5 class="font-weight-bold">Contact Us</h5>
                <p>
                    <a href="mailto:support@example.com" class="text-dark text-decoration-none">
                        <i class="bi bi-envelope"></i> Mail
                    </a>
                </p>
                <p>
                    <a href="tel:+1234567890" class="text-dark text-decoration-none">
                        <i class="bi bi-telephone"></i> Hotline
                    </a>
                </p>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
